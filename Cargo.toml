[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "Apache-2.0"
repository = "https://github.com/Alexander-Aghili/Multi-Agent-Descriptor-Language"
rust-version = "1.85"

[workspace.dependencies]
madl = { path = "crates/madl" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
serde_path_to_error = "0.1"
schemars = "1"
ts-rs = { version = "12", features = ["serde-json-impl"] }
thiserror = "2"
clap = { version = "4", features = ["derive"] }

[workspace.lints.clippy]
too_many_lines = "warn"

[profile.dev]
debug = "line-tables-only"
